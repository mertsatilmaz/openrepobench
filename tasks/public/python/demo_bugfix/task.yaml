id: demo_python_bugfix_v1
repo: local/demo-calculator
base_commit: null
language: python
task_type: bugfix
difficulty: easy
prompt: |
  The add(a, b) function in calculator.py is broken. It should return the sum
  of a and b. Fix the implementation without changing the tests.
workspace: tasks/public/python/demo_bugfix/repo

environment:
  kind: local
  timeout_seconds: 60
  network: disabled

commands:
  setup: null
  public_tests: "python -m unittest discover -s tests"
  hidden_tests: null
  regression_tests: null
  lint: null
  security: null

scoring:
  require_public_tests: true
  require_hidden_tests: false
  require_regression_tests: false
  require_lint: false
  require_security: false
  forbidden_paths:
    - tests
