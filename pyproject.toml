[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openrepobench"
version = "0.1.0"
description = "A reproducible benchmark harness for evaluating coding agents on repository maintenance tasks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "OpenRepoBench Contributors" }]
dependencies = [
  "pydantic>=2.6",
  "PyYAML>=6.0",
]

[project.scripts]
openrepobench = "openrepobench.cli:main"

[tool.setuptools.packages.find]
include = ["openrepobench*"]
